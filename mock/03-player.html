<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,system-ui,sans-serif}
body{background:#000;width:400px;height:860px;overflow:hidden;position:relative;color:#fff}
.video{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#3a2a6b,#0b0e14 70%)}
.vcenter{position:absolute;top:45%;width:100%;text-align:center;color:#ffffff22;font-size:15px;letter-spacing:2px}
.topbar{position:absolute;top:0;width:100%;padding:44px 20px 20px;background:linear-gradient(#000c,transparent);display:flex;gap:14px;align-items:center}
.title{font-size:16px;font-weight:500}.ep{font-size:13px;color:#ccc}
.x2{position:absolute;top:120px;width:100%;text-align:center}.x2 span{background:#d0bcff;color:#1a1025;font-weight:700;border-radius:16px;padding:8px 22px;font-size:15px}
.bottom{position:absolute;bottom:0;width:100%;padding:16px 20px 44px;background:linear-gradient(transparent,#000d)}
.seek{height:6px;background:#ffffff2e;border-radius:3px;margin-bottom:8px;position:relative}.seek i{display:block;width:62%;height:100%;background:#d0bcff;border-radius:3px}
.seek:after{content:'';position:absolute;left:62%;top:-4px;width:14px;height:14px;border-radius:7px;background:#d0bcff}
.times{display:flex;justify-content:space-between;font-size:12px;color:#ddd;margin-bottom:10px}
.ctrl{display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:24px;color:#fff}
.playb{font-size:44px}
.hint{display:none}
</style></head><body>
<div class="video"></div><div class="vcenter">FRIEREN EP 15</div>
<div class="x2"><span>2×</span></div>
<div class="topbar"><span style="font-size:22px">←</span><div><div class="title">Frieren</div><div class="ep">EP 15 · SubPlease 1080p</div></div></div>
<div class="hint">hold anywhere for 2× · double-tap sides ±10s · swipe volume/brightness</div>
<div class="bottom"><div class="seek"><i></i></div><div class="times"><span>14:52</span><span>23:40</span></div>
<div class="ctrl"><span>⏮</span><span>⛭</span><span class="playb">⏸</span><span>💬</span><span>⏭</span></div></div>
</body></html>
