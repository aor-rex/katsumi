name: dev build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate sample video
        run: |
          sudo apt-get install -y -q ffmpeg
          mkdir -p app/src/main/assets
          ffmpeg -y -f lavfi -i testsrc=duration=5:size=640x360:rate=30 \
            -pix_fmt yuv420p app/src/main/assets/sample.mp4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: assemble debug
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.10.2/bin/gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: katsumi-debug
          path: app/build/outputs/apk/debug/app-debug.apk
